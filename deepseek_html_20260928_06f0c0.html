<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokoku - Belanja Online</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #f5f5f5; color: #333; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; border: none; border-radius: 6px; font-size: 14px; }

.navbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; gap: 12px; flex-wrap: wrap; }
.logo { font-size: 22px; font-weight: bold; color: #e91e63; cursor: pointer; }
.search-box { flex: 1; display: flex; max-width: 500px; }
.search-box input { flex: 1; padding: 10px; border: 2px solid #e91e63; border-radius: 6px 0 0 6px; outline: none; }
.search-box button { padding: 10px 18px; background: #e91e63; color: #fff; border-radius: 0 6px 6px 0; }
.nav-links { display: flex; gap: 16px; align-items: center; font-size: 14px; }
.nav-links a { padding: 6px 10px; border-radius: 6px; transition: 0.2s; }
.nav-links a:hover { background: #fce4ec; color: #e91e63; }

.btn-primary { background: #e91e63; color: #fff; padding: 12px 24px; font-weight: bold; }
.btn-primary:hover { background: #c2185b; }
.btn-small { background: #e91e63; color: #fff; padding: 8px 14px; display: inline-block; border-radius: 6px; font-size: 13px; }
.btn-danger { background: #f44336; color: #fff; padding: 8px 12px; }

.banner { background: linear-gradient(135deg, #e91e63, #9c27b0); color: #fff; padding: 60px 24px; text-align: center; }
.banner h1 { font-size: 36px; margin-bottom: 12px; }
.banner p { font-size: 18px; margin-bottom: 20px; }

.section { padding: 32px 24px; max-width: 1200px; margin: 0 auto; }
.section h1, .section h2 { margin-bottom: 20px; }

.kategori-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 16px; }
.kategori-item { background: #fff; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
.kategori-item:hover { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0,0,0,0.1); }
.kategori-icon { font-size: 40px; margin-bottom: 8px; }

.produk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.produk-card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: 0.2s; display: flex; flex-direction: column; }
.produk-card:hover { transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0,0,0,0.1); }
.produk-card img { width: 100%; border-radius: 8px; }
.produk-card h3 { font-size: 15px; margin: 10px 0 6px; }
.harga { color: #e91e63; font-weight: bold; font-size: 15px; }
.harga-big { color: #e91e63; font-weight: bold; font-size: 24px; margin: 8px 0; }
.rating { font-size: 13px; color: #666; margin-bottom: 8px; }

.promo { background: #fff3e0; padding: 32px 24px; text-align: center; }
.promo h2 { margin-bottom: 20px; }
.voucher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; max-width: 800px; margin: 0 auto; }
.voucher-card { background: #fff; padding: 20px; border: 2px dashed #e91e63; border-radius: 10px; }
.voucher-card h3 { color: #e91e63; margin-bottom: 8px; }

footer { background: #222; color: #ddd; padding: 32px 24px 16px; margin-top: 40px; }
.footer-content { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto 20px; }
.footer-content h3, .footer-content h4 { color: #fff; margin-bottom: 10px; }
.footer-content a { display: block; padding: 4px 0; color: #bbb; }
.footer-content a:hover { color: #e91e63; }
.copyright { text-align: center; border-top: 1px solid #333; padding-top: 16px; font-size: 13px; }

.detail-produk { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; background: #fff; padding: 24px; border-radius: 10px; }
.detail-produk img { width: 100%; border-radius: 10px; }
.detail-produk select, .detail-produk input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin: 6px 0 16px; width: 100%; max-width: 200px; display: block; }
.detail-produk button { margin-top: 10px; }

.cart-item { background: #fff; padding: 16px; border-radius: 10px; display: flex; align-items: center; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
.cart-item img { border-radius: 8px; }
.qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-ctrl button { background: #e91e63; color: #fff; width: 32px; height: 32px; font-weight: bold; }
.cart-total { text-align: right; padding: 20px 0; }

.auth-box { max-width: 400px; margin: 60px auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.auth-box h1 { margin-bottom: 20px; }
.auth-box input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; }
.auth-box button { width: 100%; padding: 12px; }
.auth-box p { margin-top: 16px; text-align: center; font-size: 14px; }
.auth-box p a { color: #e91e63; font-weight: bold; }

.checkout-box { background: #fff; padding: 24px; border-radius: 10px; max-width: 700px; }
.checkout-box h3 { margin: 20px 0 10px; color: #e91e63; }
.checkout-box input, .checkout-box select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; }
.checkout-box button { width: 100%; padding: 14px; margin-top: 20px; }

.profil-card { background: #fff; padding: 32px; border-radius: 12px; text-align: center; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.avatar { font-size: 64px; margin-bottom: 12px; }
.profil-card h2 { margin-bottom: 8px; }
.profil-card p { margin: 6px 0; color: #666; }
.profil-card .btn-primary, .profil-card .btn-danger { margin-top: 16px; padding: 12px 24px; display: inline-block; }

.order-card { background: #fff; padding: 16px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.order-card small { color: #888; }

.review { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #e91e63; }

.admin-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.admin-tabs button { padding: 10px 16px; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
.admin-tabs button.active { background: #e91e63; color: #fff; border-color: #e91e63; }
.admin-panel { background: #fff; padding: 20px; border-radius: 10px; }
.admin-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
.admin-table th { background: #fce4ec; color: #c2185b; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat-card { background: linear-gradient(135deg, #e91e63, #9c27b0); color: #fff; padding: 20px; border-radius: 10px; text-align: center; }
.stat-card h2 { font-size: 28px; }

@media (max-width: 768px) {
  .detail-produk { grid-template-columns: 1fr; }
  .banner h1 { font-size: 24px; }
  .navbar { padding: 12px; }
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo" onclick="navigate('home')">🛍️ Tokoku</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Cari produk..." onkeypress="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">🔍</button>
  </div>
  <div class="nav-links">
    <a href="#" onclick="navigate('home')">Home</a>
    <a href="#" onclick="navigate('produk')">Produk</a>
    <a href="#" onclick="navigate('keranjang')">🛒 <span id="cartCount">0</span></a>
    <span id="userArea"></span>
  </div>
</nav>

<main id="app"></main>

<script>
const DB = {
  get: (k) => JSON.parse(localStorage.getItem(k) || '[]'),
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
};

function initData() {
  if (!localStorage.getItem('users')) {
    DB.set('users', [
      { id: 1, nama: 'Admin', email: 'admin@tokoku.com', password: 'admin123', role: 'admin' },
      { id: 2, nama: 'Budi', email: 'budi@mail.com', password: '123456', role: 'user' }
    ]);
  }
  if (!localStorage.getItem('categories')) {
    DB.set('categories', [
      { id: 1, nama: 'Elektronik', icon: '📱' },
      { id: 2, nama: 'Fashion', icon: '👕' },
      { id: 3, nama: 'Makanan', icon: '🍔' },
      { id: 4, nama: 'Kecantikan', icon: '💄' }
    ]);
  }
  if (!localStorage.getItem('products')) {
    DB.set('products', [
      { id: 1, nama: 'Smartphone X', harga: 3500000, stok: 10, kategori: 1, foto: 'https://placehold.co/300x300/e91e63/fff?text=HP', rating: 4.5, deskripsi: 'Smartphone canggih dengan kamera 108MP', variasi: ['Hitam','Putih','Biru'] },
      { id: 2, nama: 'Kaos Polos Premium', harga: 75000, stok: 50, kategori: 2, foto: 'https://placehold.co/300x300/9c27b0/fff?text=Kaos', rating: 4.2, deskripsi: 'Kaos katun nyaman', variasi: ['S','M','L','XL'] },
      { id: 3, nama: 'Nasi Goreng Spesial', harga: 25000, stok: 100, kategori: 3, foto: 'https://placehold.co/300x300/ff9800/fff?text=Nasgor', rating: 4.8, deskripsi: 'Nasi goreng dengan telur & ayam', variasi: ['Pedas','Biasa'] },
      { id: 4, nama: 'Lipstik Matte', harga: 85000, stok: 30, kategori: 4, foto: 'https://placehold.co/300x300/e91e63/fff?text=Lipstik', rating: 4.6, deskripsi: 'Lipstik tahan lama 12 jam', variasi: ['Merah','Pink','Nude'] },
      { id: 5, nama: 'Laptop Pro', harga: 12000000, stok: 5, kategori: 1, foto: 'https://placehold.co/300x300/2196f3/fff?text=Laptop', rating: 4.7, deskripsi: 'Laptop gaming high-end', variasi: ['8GB/256GB','16GB/512GB'] },
      { id: 6, nama: 'Sepatu Sneakers', harga: 450000, stok: 20, kategori: 2, foto: 'https://placehold.co/300x300/4caf50/fff?text=Sepatu', rating: 4.4, deskripsi: 'Sneakers casual nyaman', variasi: ['39','40','41','42'] }
    ]);
  }
  if (!localStorage.getItem('cart')) DB.set('cart', []);
  if (!localStorage.getItem('orders')) DB.set('orders', []);
  if (!localStorage.getItem('payments')) DB.set('payments', []);
  if (!localStorage.getItem('reviews')) DB.set('reviews', []);
  if (!localStorage.getItem('vouchers')) {
    DB.set('vouchers', [
      { id: 1, kode: 'DISKON10', potongan: 10, min: 100000 },
      { id: 2, kode: 'GRATIS50', potongan: 50000, min: 200000 }
    ]);
  }
}

function rupiah(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }
function getUser() { return JSON.parse(localStorage.getItem('currentUser') || 'null'); }

function updateCartCount() {
  const cart = DB.get('cart');
  const count = cart.reduce((s, c) => s + c.qty, 0);
  const el = document.getElementById('cartCount');
  if (el) el.textContent = count;
}

function updateUserArea() {
  const user = getUser();
  const area = document.getElementById('userArea');
  if (!area) return;
  if (user) {
    area.innerHTML = `
      <a href="#" onclick="navigate('profil')">👤 ${user.nama}</a>
      ${user.role === 'admin' ? '<a href="#" onclick="navigate(\'admin\')">Admin</a>' : ''}
      <a href="#" onclick="logout()">Logout</a>`;
  } else {
    area.innerHTML = `<a href="#" onclick="navigate('login')">Login</a>
                      <a href="#" onclick="navigate('register')">Register</a>`;
  }
}

function logout() {
  localStorage.removeItem('currentUser');
  alert('Logout berhasil');
  navigate('home');
}

function navigate(page, param) {
  window.scrollTo(0, 0);
  const app = document.getElementById('app');
  const routes = {
    home: renderHome, produk: renderProduk, detail: renderDetail,
    keranjang: renderKeranjang, checkout: renderCheckout, pembayaran: renderPembayaran,
    login: renderLogin, register: renderRegister, profil: renderProfil,
    riwayat: renderRiwayat, admin: renderAdmin
  };
  (routes[page] || renderHome)(app, param);
  updateCartCount();
  updateUserArea();
}

function renderHome(app) {
  const allProducts = DB.get('products');
  const products = allProducts.slice(0, 4);
  const cats = DB.get('categories');
  const vouchers = DB.get('vouchers');

  app.innerHTML = `
    <section class="banner">
      <h1>Promo Spesial Hari Ini!</h1>
      <p>Diskon hingga 50% untuk produk pilihan</p>
      <button class="btn-primary" onclick="navigate('produk')">Belanja Sekarang</button>
    </section>

    <section class="section">
      <h2>Kategori</h2>
      <div class="kategori-grid">
        ${cats.map(c => `
          <div class="kategori-item" onclick="filterKategori(${c.id})">
            <div class="kategori-icon">${c.icon}</div>
            <p>${c.nama}</p>
          </div>`).join('')}
      </div>
    </section>

    <section class="section">
      <h2>Produk Terbaru</h2>
      <div class="produk-grid">
        ${products.map(p => productCard(p)).join('')}
      </div>
    </section>

    <section class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <h2>Daftar Produk</h2>
        <button class="btn-small" onclick="navigate('produk')">Lihat Semua →</button>
      </div>
      <div class="produk-grid" style="margin-top:16px;">
        ${allProducts.map(p => productCard(p)).join('')}
      </div>
    </section>

    <section class="promo">
      <h2>🎉 Voucher Spesial</h2>
      <div class="voucher-grid">
        ${vouchers.map(v => `
          <div class="voucher-card">
            <h3>${v.kode}</h3>
            <p>Potongan ${v.potongan < 100 ? v.potongan + '%' : rupiah(v.potongan)}</p>
            <small>Min. belanja ${rupiah(v.min)}</small>
          </div>`).join('')}
      </div>
    </section>

    ${renderFooter()}
  `;
}

function productCard(p) {
  return `
    <div class="produk-card">
      <img src="${p.foto}" alt="${p.nama}">
      <h3>${p.nama}</h3>
      <p class="harga">${rupiah(p.harga)}</p>
      <p class="rating">⭐ ${p.rating} | Stok: ${p.stok}</p>
      <button class="btn-small" onclick="navigate('detail', ${p.id})">Lihat Detail</button>
    </div>`;
}

function filterKategori(id) {
  sessionStorage.setItem('filterKategori', id);
  navigate('produk');
}

function doSearch() {
  sessionStorage.setItem('searchQuery', document.getElementById('searchInput').value);
  navigate('produk');
}

function renderProduk(app) {
  const cats = DB.get('categories');
  const savedKat = sessionStorage.getItem('filterKategori') || '';
  const savedQ = sessionStorage.getItem('searchQuery') || '';
  sessionStorage.removeItem('filterKategori');
  sessionStorage.removeItem('searchQuery');

  app.innerHTML = `
    <section class="section">
      <h1>Daftar Produk</h1>
      <div class="filter-bar" style="margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;">
        <select id="filterKategoriSel" onchange="applyFilter()" style="padding:10px;border-radius:6px;border:1px solid #ccc;">
          <option value="">Semua Kategori</option>
          ${cats.map(c => `<option value="${c.id}" ${savedKat==c.id?'selected':''}>${c.nama}</option>`).join('')}
        </select>
        <select id="sortSel" onchange="applyFilter()" style="padding:10px;border-radius:6px;border:1px solid #ccc;">
          <option value="">Urutkan</option>
          <option value="harga-asc">Harga Termurah</option>
          <option value="harga-desc">Harga Termahal</option>
          <option value="rating">Rating Tertinggi</option>
        </select>
        <input id="searchProduk" placeholder="Cari..." value="${savedQ}" oninput="applyFilter()" style="padding:10px;border-radius:6px;border:1px solid #ccc;flex:1;min-width:150px;">
      </div>
      <div class="produk-grid" id="produkGrid"></div>
    </section>
    ${renderFooter()}
  `;
  applyFilter();
}

function applyFilter() {
  let produk = DB.get('products');
  const kat = document.getElementById('filterKategoriSel').value;
  const q = document.getElementById('searchProduk').value.toLowerCase();
  const sort = document.getElementById('sortSel').value;
  if (kat) produk = produk.filter(p => p.kategori == kat);
  if (q) produk = produk.filter(p => p.nama.toLowerCase().includes(q));
  if (sort === 'harga-asc') produk.sort((a,b) => a.harga - b.harga);
  if (sort === 'harga-desc') produk.sort((a,b) => b.harga - a.harga);
  if (sort === 'rating') produk.sort((a,b) => b.rating - a.rating);
  document.getElementById('produkGrid').innerHTML = produk.length
    ? produk.map(p => productCard(p)).join('')
    : '<p>Tidak ada produk ditemukan.</p>';
}

function renderDetail(app, id) {
  const p = DB.get('products').find(x => x.id == id);
  if (!p) { app.innerHTML = '<section class="section"><p>Produk tidak ditemukan</p></section>'; return; }

  app.innerHTML = `
    <section class="section">
      <button onclick="navigate('produk')" class="btn-small" style="margin-bottom:16px;">← Kembali</button>
      <div class="detail-produk">
        <img src="${p.foto}" alt="${p.nama}">
        <div>
          <h1>${p.nama}</h1>
          <p class="rating">⭐ ${p.rating}</p>
          <p class="harga-big">${rupiah(p.harga)}</p>
          <p>Stok tersedia: <b>${p.stok}</b></p>
          <p style="margin:12px 0;">${p.deskripsi}</p>
          <label>Variasi:</label>
          <select id="variasiSel">${(p.variasi||[]).map(v => `<option>${v}</option>`).join('')}</select>
          <label>Jumlah:</label>
          <input type="number" id="qtyInput" value="1" min="1" max="${p.stok}">
          <button class="btn-primary" onclick="addToCart(${p.id}, parseInt(document.getElementById('qtyInput').value))">
            🛒 Tambah ke Keranjang
          </button>
        </div>
      </div>

      <section style="margin-top:32px;">
        <h2>Ulasan</h2>
        <div id="reviewsList"></div>
        <h3 style="margin-top:20px;">Tulis Ulasan</h3>
        <textarea id="reviewText" placeholder="Tulis ulasan..." style="width:100%;padding:10px;border-radius:6px;border:1px solid #ccc;"></textarea>
        <button class="btn-primary" style="margin-top:10px;" onclick="submitReview(${p.id})">Kirim Ulasan</button>
      </section>
    </section>
    ${renderFooter()}
  `;
  renderReviews(id);
}

function renderReviews(produkId) {
  const reviews = DB.get('reviews').filter(r => r.produkId == produkId);
  document.getElementById('reviewsList').innerHTML = reviews.length
    ? reviews.map(r => `<div class="review"><strong>${r.nama}</strong> ⭐${r.rating}<p>${r.text}</p></div>`).join('')
    : '<p>Belum ada ulasan.</p>';
}

function submitReview(produkId) {
  const user = getUser();
  if (!user) { alert('Login dulu untuk memberi ulasan'); navigate('login'); return; }
  const text = document.getElementById('reviewText').value.trim();
  if (!text) return alert('Tulis ulasan dulu');
  const reviews = DB.get('reviews');
  reviews.push({ produkId: Number(produkId), nama: user.nama, text, rating: 5 });
  DB.set('reviews', reviews);
  document.getElementById('reviewText').value = '';
  renderReviews(produkId);
  alert('Ulasan terkirim!');
}

function addToCart(produkId, qty = 1) {
  const produk = DB.get('products').find(p => p.id === produkId);
  if (!produk) return;
  if (produk.stok < qty) return alert('Stok tidak cukup');
  const cart = DB.get('cart');
  const existing = cart.find(c => c.id === produkId);
  if (existing) existing.qty += qty;
  else cart.push({ id: produkId, nama: produk.nama, harga: produk.harga, foto: produk.foto, qty });
  DB.set('cart', cart);
  updateCartCount();
  alert('✅ Ditambahkan ke keranjang!');
}

function renderKeranjang(app) {
  const cart = DB.get('cart');
  if (!cart.length) {
    app.innerHTML = `
      <section class="section">
        <h1>Keranjang Belanja</h1>
        <p>Keranjang kosong. <a href="#" onclick="navigate('produk')" style="color:#e91e63;font-weight:bold;">Belanja sekarang</a></p>
      </section>${renderFooter()}`;
    return;
  }
  const total = cart.reduce((s, c) => s + c.harga * c.qty, 0);
  app.innerHTML = `
    <section class="section">
      <h1>Keranjang Belanja</h1>
      <div id="cartList">
        ${cart.map(c => `
          <div class="cart-item">
            <img src="${c.foto}" width="80" style="border-radius:8px">
            <div style="flex:1"><h4>${c.nama}</h4><p class="harga">${rupiah(c.harga)}</p></div>
            <div class="qty-ctrl">
              <button onclick="updateQty(${c.id}, -1)">−</button>
              <span>${c.qty}</span>
              <button onclick="updateQty(${c.id}, 1)">+</button>
            </div>
            <p><b>${rupiah(c.harga * c.qty)}</b></p>
            <button class="btn-danger" onclick="removeItem(${c.id})">🗑️</button>
          </div>`).join('')}
      </div>
      <div class="cart-total"><h2>Total: <span style="color:#e91e63">${rupiah(total)}</span></h2></div>
      <div style="text-align:right">
        <button class="btn-primary" onclick="navigate('checkout')">Lanjut ke Checkout →</button>
      </div>
    </section>
    ${renderFooter()}`;
}

function updateQty(id, delta) {
  const cart = DB.get('cart');
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) return removeItem(id);
  DB.set('cart', cart);
  navigate('keranjang');
}

function removeItem(id) {
  if (!confirm('Hapus produk ini?')) return;
  DB.set('cart', DB.get('cart').filter(c => c.id !== id));
  navigate('keranjang');
}

  if (!user) { alert('Login dulu!'); return navigate('login'); }

  checkoutDiskon = 0;

  app.innerHTML = `
    <section class="section">
      <h1>Checkout</h1>
      <div class="checkout-box">
        <h3>📍 Alamat Pengiriman</h3>
        <input type="text" id="namaPenerima" placeholder="Nama penerima" value="${user.nama}">
        <input type="text" id="alamat" placeholder="Alamat lengkap">
        <input type="text" id="telepon" placeholder="No. telepon">

        <h3>🚚 Pengiriman</h3>
        <select id="kurir" onchange="renderRingkasan()">
          <option value="10000">JNE - ${rupiah(10000)}</option>

          <option value="20000">SiCepat - ${rupiah(20000)}</option>
        </select>

        <button class="btn-small" onclick="applyVoucher()">Terapkan</button>

}

function renderRingkasan() {
  const cart = DB.get('cart');
  const subtotal = cart.reduce((s, c) => s + c.harga * c.qty, 0);
  const ongkir = parseInt(document.getElementById('kurir').value);
  const total = subtotal - checkoutDiskon + ongkir;
  document.getElementById('ringkasan').innerHTML = `
    ${cart.map(c => `<p>${c.nama} x${c.qty} = ${rupiah(c.harga * c.qty)}</p>`).join('')}
    <hr style="margin:10px 0;">
    <p>Subtotal: ${rupiah(subtotal)}</p>
    <p>Diskon: -${rupiah(checkoutDiskon)}</p>
    <p>Ongkir: ${rupiah(ongkir)}</p>
    <h3 style="color:#e91e63;margin-top:10px;">Total: ${rupiah(total)}</h3>`;
}

function applyVoucher() {
  const code = document.getElementById('voucherCode').value.toUpperCase();
  const v = DB.get('vouchers').find(x => x.kode === code);
  const cart = DB.get('cart');
  const subtotal = cart.reduce((s, c) => s + c.harga * c.qty, 0);
  if (!v) { document.getElementById('voucherInfo').textContent = '❌ Voucher tidak valid'; checkoutDiskon = 0; }
  else if (subtotal < v.min) { document.getElementById('voucherInfo').textContent = `❌ Min. belanja ${rupiah(v.min)}`; checkoutDiskon = 0; }
  else {
    checkoutDiskon = v.potongan < 100 ? subtotal * v.potongan / 100 : v.potongan;
    document.getElementById('voucherInfo').textContent = `✅ Diskon ${rupiah(checkoutDiskon)}`;
  }
  renderRingkasan();
}
